{% extends "base.html" %}

{% block title %}404 Not Found — Project Kashi{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center;">
    <div class="card-header" style="justify-content: center;">
        <h2 style="color: var(--primary);">404 — Resource Not Found</h2>
    </div>
    <div class="card-body">
        <p style="font-size: 1rem; color: #475569; margin-bottom: 1.5rem;">
            The requested banking page, account record, or resource does not exist in the system.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
