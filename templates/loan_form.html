{% extends "base.html" %}
{% block title %}New Loan - Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1 class="page-title">New Loan Application</h1><p class="page-subtitle">Every new application starts with status Pending</p></div>
    <div class="page-actions"><a href="{{ url_for('loans') }}" class="btn btn-secondary">Back to Loans</a></div>
</div>

<section class="panel form-panel">
    <form method="post" action="{{ url_for('loan_new') }}" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label for="CustomerID">Customer</label>
            <select id="CustomerID" name="CustomerID" required class="input">
                <option value="">Select Customer</option>
                {% for c in customers %}<option value="{{ c.CustomerID }}">{{ c.CustomerID }} - {{ c.FirstName }} {{ c.LastName }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group"><label for="BranchID">Branch</label>
            <select id="BranchID" name="BranchID" required class="input">
                <option value="">Select Branch</option>
                {% for b in branches %}<option value="{{ b.BranchID }}">{{ b.BranchName }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group"><label for="LoanType">Loan Type</label>
            <select id="LoanType" name="LoanType" required class="input">
                <option value="">Select Type</option>
                {% for t in ['Home Loan','Education Loan','Personal Loan','Vehicle Loan'] %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group"><label for="LoanAmount">Loan Amount (₹)</label><input class="input" type="number" min="0.01" step="0.01" id="LoanAmount" name="LoanAmount" required></div>
        <div class="form-group"><label for="InterestRate">Interest Rate (%)</label><input class="input" type="number" min="0" max="50" step="0.01" id="InterestRate" name="InterestRate" required></div>
        <div class="form-group"><label for="StartDate">Start Date</label><input class="input" type="date" id="StartDate" name="StartDate" required></div>
        <div class="form-group"><label for="TenureMonths">Tenure (months)</label><input class="input" type="number" min="1" max="600" id="TenureMonths" name="TenureMonths" required></div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Submit Application</button></div>
    </form>
</section>
{% endblock %}
