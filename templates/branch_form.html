{% extends "base.html" %}
{% block title %}Add Branch - Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1 class="page-title">Create Branch</h1><p class="page-subtitle">IFSC codes must follow the format ABCD0123456</p></div>
    <div class="page-actions"><a href="{{ url_for('branches') }}" class="btn btn-secondary">Back</a></div>
</div>

<section class="panel form-panel">
    <form method="post" action="{{ url_for('branch_new') }}" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label for="BranchName">Branch Name</label><input class="input" id="BranchName" name="BranchName" required></div>
        <div class="form-group"><label for="IFSCCode">IFSC Code</label><input class="input" id="IFSCCode" name="IFSCCode" required maxlength="11" pattern="[A-Za-z]{4}0[0-9]{6}" placeholder="KASH0000006"></div>
        <div class="form-group form-group-full"><label for="Address">Address</label><input class="input" id="Address" name="Address" required></div>
        <div class="form-group"><label for="City">City</label><input class="input" id="City" name="City" required></div>
        <div class="form-group"><label for="State">State</label><input class="input" id="State" name="State" required></div>
        <div class="form-group"><label for="ContactNumber">Contact Number</label><input class="input" id="ContactNumber" name="ContactNumber" required pattern="[0-9]{10,15}"></div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Create Branch</button></div>
    </form>
</section>
{% endblock %}
