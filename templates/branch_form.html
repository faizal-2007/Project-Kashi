{% extends "base.html" %}

{% block title %}Create Branch — Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Register New Branch</h2>
        <p class="page-subtitle">Add a physical banking center and allocate its unique IFSC routing code</p>
    </div>
    <a href="{{ url_for('branch_list') }}" class="btn btn-secondary">&larr; Back to Branches</a>
</div>

<div class="card" style="max-width: 750px; margin: 0 auto;">
    <div class="card-header">
        <h3>Branch Details Form</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('branch_create') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="name">Branch Name *</label>
                    <input type="text" id="name" name="name" class="form-control" required value="{{ form_data.name if form_data else '' }}" placeholder="e.g. Kashi Main Branch">
                </div>

                <div class="form-group">
                    <label class="form-label" for="ifsc">IFSC Code * (Must be Unique)</label>
                    <input type="text" id="ifsc" name="ifsc" class="form-control" required minlength="8" maxlength="15" value="{{ form_data.ifsc if form_data else '' }}" placeholder="e.g. KASH0001001">
                </div>

                <div class="form-group full-width">
                    <label class="form-label" for="address">Street Address *</label>
                    <input type="text" id="address" name="address" class="form-control" required value="{{ form_data.address if form_data else '' }}" placeholder="e.g. Dashashwamedh Ghat Road">
                </div>

                <div class="form-group">
                    <label class="form-label" for="city">City *</label>
                    <input type="text" id="city" name="city" class="form-control" required value="{{ form_data.city if form_data else '' }}" placeholder="e.g. Varanasi">
                </div>

                <div class="form-group">
                    <label class="form-label" for="state">State *</label>
                    <input type="text" id="state" name="state" class="form-control" required value="{{ form_data.state if form_data else '' }}" placeholder="e.g. Uttar Pradesh">
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact">Contact Number *</label>
                    <input type="text" id="contact" name="contact" class="form-control" required value="{{ form_data.contact if form_data else '' }}" placeholder="e.g. 0542-2451001">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Branch</button>
                <a href="{{ url_for('branch_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
