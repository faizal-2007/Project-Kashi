{% extends "base.html" %}
{% block title %}Add Employee - Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div><h1 class="page-title">Add Employee</h1><p class="page-subtitle">Create an employee record linked to a branch</p></div>
    <div class="page-actions"><a href="{{ url_for('employees') }}" class="btn btn-secondary">Back</a></div>
</div>

<section class="panel form-panel">
    <form method="post" action="{{ url_for('employee_new') }}" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label for="EmployeeName">Employee Name</label><input class="input" id="EmployeeName" name="EmployeeName" required></div>
        <div class="form-group"><label for="Designation">Designation</label><input class="input" id="Designation" name="Designation" required></div>
        <div class="form-group"><label for="Mobile">Mobile</label><input class="input" id="Mobile" name="Mobile" required pattern="[0-9]{10,15}"></div>
        <div class="form-group"><label for="Email">Email</label><input class="input" type="email" id="Email" name="Email" required></div>
        <div class="form-group"><label for="Salary">Salary (₹)</label><input class="input" type="number" min="0.01" step="0.01" id="Salary" name="Salary" required></div>
        <div class="form-group"><label for="JoiningDate">Joining Date</label><input class="input" type="date" id="JoiningDate" name="JoiningDate" required></div>
        <div class="form-group"><label for="BranchID">Branch</label>
            <select class="input" id="BranchID" name="BranchID" required>
                <option value="">Select Branch</option>
                {% for b in branches %}<option value="{{ b.BranchID }}">{{ b.BranchName }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Add Employee</button></div>
    </form>
</section>
{% endblock %}
