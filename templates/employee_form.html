{% extends "base.html" %}

{% block title %}Add Employee — Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Onboard Bank Employee</h2>
        <p class="page-subtitle">Assign staff member to a branch with designation and salary</p>
    </div>
    <a href="{{ url_for('employee_list') }}" class="btn btn-secondary">&larr; Back to Employees</a>
</div>

<div class="card" style="max-width: 750px; margin: 0 auto;">
    <div class="card-header">
        <h3>Employee Information Form</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('employee_create') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="name">Employee Full Name *</label>
                    <input type="text" id="name" name="name" class="form-control" required value="{{ form_data.name if form_data else '' }}" placeholder="e.g. Priya Kulkarni">
                </div>

                <div class="form-group">
                    <label class="form-label" for="designation">Designation *</label>
                    <select id="designation" name="designation" class="form-control" required>
                        <option value="">-- Choose Designation --</option>
                        <option value="Branch Manager">Branch Manager</option>
                        <option value="Assistant Manager">Assistant Manager</option>
                        <option value="Senior Cashier">Senior Cashier</option>
                        <option value="Loan Officer">Loan Officer</option>
                        <option value="Operations Officer">Operations Officer</option>
                        <option value="Customer Relationship Exec">Customer Relationship Exec</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="branch_id">Allocated Branch *</label>
                    <select id="branch_id" name="branch_id" class="form-control" required>
                        <option value="">-- Select Branch --</option>
                        {% for b in branches %}
                            <option value="{{ b.BranchID }}">
                                {{ b.BranchName }} ({{ b.City }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="salary">Monthly Salary (₹) *</label>
                    <input type="number" id="salary" name="salary" class="form-control" min="1000" step="0.01" required value="{{ form_data.salary if form_data else '50000.00' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="mobile">Mobile Number (10 Digits) *</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" pattern="[0-9]{10}" required value="{{ form_data.mobile if form_data else '' }}" placeholder="e.g. 9876543211">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Work Email *</label>
                    <input type="email" id="email" name="email" class="form-control" required value="{{ form_data.email if form_data else '' }}" placeholder="e.g. priya.k@kashibank.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="joining_date">Joining Date *</label>
                    <input type="date" id="joining_date" name="joining_date" class="form-control" required value="{{ form_data.joining_date if form_data else '' }}">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Onboard Employee</button>
                <a href="{{ url_for('employee_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
