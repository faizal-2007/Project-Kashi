{% extends "base.html" %}
{% block title %}Open Account - Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Account Opening</h1>
        <p class="page-subtitle">Create ACCOUNT and ACCOUNT_HOLDER entries atomically</p>
    </div>
    <div class="page-actions">
        <a href="{{ url_for('accounts') }}" class="btn btn-secondary">Back to Accounts</a>
    </div>
</div>

<section class="panel form-panel">
    <form method="post" action="{{ url_for('account_open') }}" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group form-group-full">
            <label for="CustomerID">Select Customer</label>
            <select id="CustomerID" name="CustomerID" required class="input">
                <option value="">-- Choose Customer --</option>
                {% for c in customers %}
                <option value="{{ c.CustomerID }}">{{ c.CustomerID }} - {{ c.FirstName }} {{ c.LastName }} ({{ c.Mobile }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="AccountType">Account Type</label>
            <select id="AccountType" name="AccountType" required class="input">
                <option value="">Select</option>
                <option value="Saving">Saving</option>
                <option value="Current">Current</option>
                <option value="Salary">Salary</option>
            </select>
        </div>
        <div class="form-group">
            <label for="BranchID">Branch</label>
            <select id="BranchID" name="BranchID" required class="input">
                <option value="">Select Branch</option>
                {% for b in branches %}
                <option value="{{ b.BranchID }}">{{ b.BranchName }} - {{ b.City }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="HolderType">Holder Type</label>
            <select id="HolderType" name="HolderType" class="input">
                <option value="Primary">Primary</option>
                <option value="Joint">Joint</option>
            </select>
        </div>
        <div class="form-group">
            <label for="InitialDeposit">Initial Deposit (₹)</label>
            <input type="number" step="0.01" min="0" id="InitialDeposit" name="InitialDeposit" value="0" class="input">
            <small class="form-help">If &gt; 0, a DEPOSIT transaction will be recorded.</small>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Open Account</button>
            <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
    </form>
</section>
{% endblock %}
