{% extends "base.html" %}

{% block title %}Error — Project Kashi{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center;">
    <div class="card-header" style="justify-content: center;">
        <h2 style="color: var(--danger);">System Notification</h2>
    </div>
    <div class="card-body">
        <p style="font-size: 1rem; color: #475569; margin-bottom: 1.5rem;">
            {{ error_message or "An unexpected system error occurred while processing your banking request." }}
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
