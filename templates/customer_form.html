{% extends "base.html" %}
{% block title %}Register Customer - Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Customer Registration</h1>
        <p class="page-subtitle">Add a new customer to the CUSTOMER table</p>
    </div>
    <div class="page-actions">
        <a href="{{ url_for('customers') }}" class="btn btn-secondary">Back to Customers</a>
    </div>
</div>

<section class="panel form-panel">
    <form method="post" action="{{ url_for('customer_new') }}" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="FirstName">First Name</label>
            <input type="text" id="FirstName" name="FirstName" required class="input">
        </div>
        <div class="form-group">
            <label for="LastName">Last Name</label>
            <input type="text" id="LastName" name="LastName" required class="input">
        </div>
        <div class="form-group">
            <label for="DateOfBirth">Date of Birth</label>
            <input type="date" id="DateOfBirth" name="DateOfBirth" required class="input">
        </div>
        <div class="form-group">
            <label for="Gender">Gender</label>
            <select id="Gender" name="Gender" required class="input">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label for="Mobile">Mobile (10-15 digits)</label>
            <input type="text" id="Mobile" name="Mobile" required pattern="[0-9]{10,15}" class="input" placeholder="e.g. 9876543210">
        </div>
        <div class="form-group">
            <label for="Email">Email</label>
            <input type="email" id="Email" name="Email" required class="input" placeholder="name@example.com">
        </div>
        <div class="form-group form-group-full">
            <label for="Address">Address</label>
            <input type="text" id="Address" name="Address" required class="input">
        </div>
        <div class="form-group">
            <label for="City">City</label>
            <input type="text" id="City" name="City" required class="input">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Register Customer</button>
            <button type="reset" class="btn btn-secondary">Clear</button>
        </div>
    </form>
</section>
{% endblock %}
