{% extends "base.html" %}

{% block title %}Register Customer — Project Kashi{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2 class="page-title">Customer Onboarding</h2>
        <p class="page-subtitle">Register a new retail or corporate customer into the banking database</p>
    </div>
    <a href="{{ url_for('customer_list') }}" class="btn btn-secondary">&larr; Back to Directory</a>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h3>New Customer Registration Form</h3>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('customer_register') }}">
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="first_name">First Name *</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" required value="{{ form_data.first_name if form_data else '' }}" placeholder="e.g. Aarav">
                </div>

                <div class="form-group">
                    <label class="form-label" for="last_name">Last Name *</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" required value="{{ form_data.last_name if form_data else '' }}" placeholder="e.g. Pandey">
                </div>

                <div class="form-group">
                    <label class="form-label" for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" class="form-control" required value="{{ form_data.dob if form_data else '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="gender">Gender *</label>
                    <select id="gender" name="gender" class="form-control" required>
                        <option value="">Select Gender</option>
                        <option value="Male" {% if form_data and form_data.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if form_data and form_data.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if form_data and form_data.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="mobile">Mobile Number (10 Digits) *</label>
                    <input type="tel" id="mobile" name="mobile" class="form-control" pattern="[0-9]{10}" required value="{{ form_data.mobile if form_data else '' }}" placeholder="e.g. 9811122233">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" required value="{{ form_data.email if form_data else '' }}" placeholder="e.g. name@example.com">
                </div>

                <div class="form-group full-width">
                    <label class="form-label" for="address">Residential Address *</label>
                    <input type="text" id="address" name="address" class="form-control" required value="{{ form_data.address if form_data else '' }}" placeholder="e.g. B-12 Assi Ghat Road">
                </div>

                <div class="form-group">
                    <label class="form-label" for="city">City *</label>
                    <input type="text" id="city" name="city" class="form-control" required value="{{ form_data.city if form_data else '' }}" placeholder="e.g. Varanasi">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Complete Registration</button>
                <a href="{{ url_for('customer_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
